<!-- navbar.component.html
     Navigation bar displayed at the top of the protected area.
     Shows user information and top-level action icons. -->
<header class="h-16 px-6 flex items-center justify-between glass-card border-x-0 border-t-0 rounded-none bg-dark-900/80 sticky top-0 z-10">
  <div class="flex items-center gap-4">
    <!-- Search could go here -->
  </div>
  
  <div class="flex items-center gap-6">
    <button class="relative text-text-muted hover:text-white transition-colors">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-0 right-0 w-2 h-2 bg-indigo-500 rounded-full"></span>
    </button>

    <div class="flex items-center gap-3">
      @if (authService.user()) {
        <div class="text-right hidden sm:block">
          <div class="text-sm font-medium text-white">{{ authService.user()?.name }}</div>
          <div class="text-xs text-text-muted">{{ authService.user()?.email }}</div>
        </div>
        <img [src]="authService.user()?.avatar || 'assets/default-avatar.png'" class="w-9 h-9 rounded-full border border-dark-700">
      }
    </div>
  </div>
</header>
