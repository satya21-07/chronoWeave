services:
  - type: web_service
    name: chronoWeave
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    autoDeploy: true
    plan: starter
    envVars:
      - key: SECRET_KEY
        value: "flowboard-super-secret-key-change-in-production-2024"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: chronoWeave-db
          property: connectionString

databases:
  - name: chronoWeave-db
    engine: postgresql
    plan: starter
